<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Fotografías por grupo</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-y: auto;
    }

    .header {
      position: sticky;
      top: 0;
      background-color: #1a1f2e;
      padding: 20px;
      border-bottom: 1px solid #2a2f3e;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #e0e0e0;
      margin: 0 0 8px 0;
    }

    .header .subtitle {
      font-size: 14px;
      color: #8a8f9a;
      margin: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: #b0b5c0;
    }

    .controls select {
      background-color: #2a2f3e;
      color: #e0e0e0;
      border: 1px solid #3a3f4e;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
      color: #8a8f9a;
    }

    .legend-scale {
      width: 160px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, hsl(0, 70%, 50%), hsl(60, 70%, 50%), hsl(120, 60%, 45%));
    }

    .content {
      padding: 20px;
    }

    .table-container {
      background-color: #2a2f3e;
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background-color: #1a1f2e;
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #8a8f9a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #3a3f4e;
    }

    th.num,
    td.num {
      text-align: right;
      width: 90px;
    }

    tbody tr {
      /* --heat-hue is set per row: 0 red, 60 yellow, 120 green */
      background-color: hsla(var(--heat-hue, 0), 70%, 45%, 0.16);
      border-bottom: 1px solid #3a3f4e;
      box-shadow: inset 5px 0 0 hsl(var(--heat-hue, 0), 70%, 50%);
    }

    tbody tr:hover {
      background-color: hsla(var(--heat-hue, 0), 70%, 45%, 0.26);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    td {
      padding: 10px 16px;
      font-size: 14px;
      color: #e0e0e0;
      font-variant-numeric: tabular-nums;
    }

    td:first-child {
      padding-left: 20px;
    }

    .group-name {
      font-weight: 500;
    }

    .group-code {
      font-size: 12px;
      color: #8a8f9a;
    }

    td.missing {
      font-weight: 600;
      color: hsl(var(--heat-hue, 0), 80%, 70%);
    }

    .progress-cell {
      width: 220px;
      white-space: nowrap;
    }

    .progress-bar {
      display: inline-block;
      vertical-align: middle;
      width: 140px;
      height: 10px;
      border-radius: 5px;
      background-color: rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: hsl(var(--heat-hue, 0), 70%, 50%);
    }

    .progress-label {
      display: inline-block;
      vertical-align: middle;
      width: 60px;
      margin-left: 10px;
      text-align: right;
      font-size: 13px;
    }

    tr.complete .progress-label {
      color: hsl(120, 60%, 65%);
      font-weight: 600;
    }

    .all-hidden {
      padding: 24px;
      text-align: center;
      color: #8a8f9a;
      font-size: 14px;
    }

    .loading,
    .empty-state,
    .error-state {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #2a2f3e;
      border-top-color: #4a7cc7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state-title {
      font-size: 20px;
      font-weight: 600;
      color: #e0e0e0;
      margin: 0 0 8px 0;
    }

    .error-state .state-title {
      color: #dc3545;
    }

    .state-text {
      font-size: 14px;
      color: #8a8f9a;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Fotografías por grupo</h1>
      <p class="subtitle" id="subtitle">Usuarios con foto enlazada en cada grupo</p>
      <div class="legend">
        <span>0 %</span>
        <span class="legend-scale"></span>
        <span>100 %</span>
      </div>
    </div>
    <div class="controls">
      <label>
        Fotografías
        <select id="source-select">
          <option value="captured">Capturadas</option>
          <option value="repository">Del depósito</option>
        </select>
      </label>
      <label>
        Orden
        <select id="order-select">
          <option value="code">Por grupo</option>
          <option value="progress">Menos avanzados primero</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="hide-complete">
        Ocultar grupos completos
      </label>
    </div>
  </div>

  <div class="content">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p class="state-text">Cargando grupos...</p>
    </div>

    <div id="error" class="error-state" style="display: none;">
      <h2 class="state-title">Error al cargar los datos</h2>
      <p class="state-text" id="error-message"></p>
    </div>

    <div id="empty" class="empty-state" style="display: none;">
      <h2 class="state-title">No hay usuarios</h2>
      <p class="state-text">El proyecto no tiene usuarios en ningún grupo</p>
    </div>

    <div id="table-wrapper" style="display: none;">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Grupo</th>
              <th class="num">Usuarios</th>
              <th class="num">Con foto</th>
              <th class="num">Sin foto</th>
              <th>Progreso</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div id="all-hidden" class="all-hidden" style="display: none;">Todos los grupos están completos</div>
      </div>
    </div>
  </div>

  <script src="group-coverage.js"></script>
</body>
</html>
